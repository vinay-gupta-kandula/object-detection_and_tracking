# data/data.yaml
path: .  # dataset root dir (relative to where script is run)
train: data/train  # train images path
val: data/valid  # validation images path

# Classes (Based on VisDrone2019 format)
nc: 10
names:
  0: pedestrian
  1: people
  2: bicycle
  3: car
  4: van
  5: truck
  6: tricycle
  7: awning-tricycle
  8: bus
  9: motor